name: Validar actualización de PDFs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Importar lote y proteger versiones anteriores
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BASE" ]]; then args=(--base-ref "$BASE"); fi
          python scripts/import_pdfs.py "${args[@]}" | tee pdf-import-report.txt
      - run: python scripts/build_site.py
      - run: python scripts/check_fs_site.py
      - run: python scripts/check_f11_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-preview
          path: |
            pdf-import-report.txt
            data/
            site/
