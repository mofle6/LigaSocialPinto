name: Verificar Fútbol 11 (sin publicar)
on:
  pull_request:
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/check-f11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar sintaxis de lectores
        run: python -m compileall -q scripts
      - name: Generar sitio en entorno de pruebas
        run: python scripts/build_site.py
      - name: Validar F11 y fichas de equipos
        run: python scripts/check_f11_site.py
