name: Verificar ligas y horarios
on:
  pull_request:
    paths:
      - "pdfs/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: python scripts/import_pdfs.py
      - run: python scripts/build_site.py
      - name: Comprobar las seis ligas
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from check_league_site import check
          for code, count in [('1dvf7',13),('2dvf7',13),('3dvf7',13),('4dvf7',12),('f11',10),('fs',14)]:
              check(code,count)
          PY
