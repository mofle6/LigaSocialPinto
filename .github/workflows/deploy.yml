
name: Actualizar Liga Social Pinto

on:
  push:
    branches:
      - main
    paths:
      - "pdfs/**"
      - "pdfs-copa/**"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "templates/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Procesar PDFs y publicar web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas de importación
        run: python -m unittest discover -s tests -v

      - name: Procesar y validar PDFs conjuntamente
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then args=(--base-ref "$BEFORE"); fi
          python scripts/import_pdfs.py "${args[@]}" | tee pdf-import-report.txt

      - name: Guardar informe y datos generados
        uses: actions/upload-artifact@v4
        with:
          name: pdf-import
          path: |
            pdf-import-report.txt
            data/


      - name: Generar web
        env:
          CUP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/import_cup_pdfs.py
          python scripts/build_site.py
          python scripts/check_unified_site.py
          node tests/test_cup_engine.cjs

      - name: Comprobar archivos generados
        run: |
          test -d site
          test -f site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar web para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
